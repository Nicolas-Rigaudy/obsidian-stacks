name: Release

# Pushing a tag equal to the manifest version (no "v" prefix, e.g. 0.2.0)
# builds the plugin and drafts a GitHub release with the three files the
# community directory installs from. The draft is published by hand.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches manifest.json and versions.json
        run: node scripts/check-release.mjs "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm run build
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --draft --title "${GITHUB_REF_NAME}" --generate-notes
